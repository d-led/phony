name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          # The library has one dependency, the leak check its tests use, so the
          # module cache is small and worth keeping between runs.

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants to change:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Tests
        run: |
          "$(go env GOPATH)/bin/gotestsum" --format testname \
            --junitfile junit.xml --jsonfile go-test.json \
            -- -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage
        if: ${{ !cancelled() }}
        run: |
          test -f coverage.out || exit 0
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: |
            junit.xml
            go-test.json
            coverage.out
          if-no-files-found: warn
          retention-days: 14

  floor:
    # The oldest toolchain go.mod promises, tested with nothing but the standard
    # library: the report tooling in the job above needs a newer Go than this one.
    name: Tests (Go 1.19, the floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.19.x'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 -race ./...

  example:
    name: Example module
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Tests of the example
        working-directory: examples/virtualtime-ticking
        run: go test -count=1 ./...

      - name: The example itself
        working-directory: examples/virtualtime-ticking
        run: go run .

  memory:
    # The race detector runs in the Tests job. These are the memory checkers, and
    # the toolchain has them on linux/amd64 only, which is this runner.
    name: Memory checkers (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'

      - name: The memory sanitizer
        env:
          CC: clang
        run: |
          go test -count=1 -msan ./...
          (cd examples/virtualtime-ticking && go test -count=1 -msan ./...)

      - name: The address sanitizer
        env:
          CC: clang
        run: |
          go test -count=1 -asan ./...
          (cd examples/virtualtime-ticking && go test -count=1 -asan ./...)
